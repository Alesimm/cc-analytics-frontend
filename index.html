<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Analytics | Inteligencia Deportiva</title>
    
    <!-- exportacion para diseño e iconos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- tipografia principal -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="relative w-full min-h-screen bg-gray-50 flex items-center justify-center overflow-x-hidden p-4 md:p-0">

    <!-- fondo corporativo q va a estar siempre atras -->
    <div id="bg-image" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-700 pointer-events-none" 
         style="background-image: url('https://d2xsxph8kpxj0f.cloudfront.net/310519663689721233/EKZ3k6UWPXd6xMygAzsmTd/cc-analytics-hero-ejpfpoxtyyaSFioBKs7ghg.webp'); opacity: 0.15;">
    </div>

    <!-- logo y nombre del club pegados arriba a la derecha -->
    <header class="absolute top-4 right-4 md:top-8 md:right-12 z-50 flex items-center gap-2 md:gap-4 pointer-events-none">
        <div class="text-right hidden sm:block">
            <h2 class="text-base md:text-xl font-black text-gray-900 uppercase tracking-widest">Colo-Colo</h2>
            <p class="text-[9px] md:text-xs font-bold text-gray-500 uppercase tracking-wider">CC Analytics</p>
        </div>
        <img src="assets/logo-colocolo.png" alt="Escudo Colo-Colo" class="w-12 md:w-20 h-auto drop-shadow-md opacity-90">
    </header>

    <!-- caja del form de login -->
    <main id="login-view" class="relative z-10 bg-white p-8 md:p-14 mt-24 md:mt-0 rounded-xl shadow-2xl w-full max-w-lg border border-gray-200 transition-all duration-500">
        
        <!-- titulo del form -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold uppercase tracking-tight text-black">CC Analytics</h1>
            <p class="text-gray-500 text-xs md:text-sm mt-2 font-bold tracking-[0.2em] uppercase">Inteligencia Deportiva</p>
            <div class="w-16 h-1 bg-black mx-auto mt-6"></div>
        </div>

        <!-- form sin las validaciones  -->
        <form id="login-form" novalidate class="space-y-7">
            <div>
                <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Correo Institucional</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-gray-400 text-lg"></i>
                    </div>
                    <input type="email" id="email" 
                           class="w-full pl-12 pr-4 py-4 bg-gray-50/50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition-all text-base" 
                           placeholder="ejemplo@colocolo.cl">
                </div>
                <!-- parrafo vacio pa inyectar errores de correo con js -->
                <p id="email-error" class="hidden text-red-600 text-xs font-bold mt-2 ml-1"></p>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400 text-lg"></i>
                    </div>
                    <input type="password" id="password" 
                           class="w-full pl-12 pr-4 py-4 bg-gray-50/50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black transition-all text-base" 
                           placeholder="••••••••">
                </div>
                <!-- parrafo vacio para inyectar errores -->
                <p id="password-error" class="hidden text-red-600 text-xs font-bold mt-2 ml-1"></p>
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full bg-black text-white text-sm font-bold py-5 rounded-lg hover:bg-gray-800 transition-all shadow-md uppercase tracking-widest">
                    Ingresar
                </button>
            </div>
        </form>
    </main>

    <!-- caja principal donde van a cargar las otras pags -->
    <div id="app-view" class="hidden relative z-20 w-full min-h-screen pt-20 pb-4 px-4 md:pt-28 md:px-8 transition-all duration-500">
        
        <!-- contenedor maestro: menu + contenido -->
        <div class="flex flex-col md:flex-row w-full max-w-7xl mx-auto h-[85vh] bg-white border-2 border-black shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] overflow-hidden">
            
            <!-- menu lateral -->
            <aside class="w-full md:w-64 border-b-2 md:border-b-0 md:border-r-2 border-black bg-gray-50 flex flex-col justify-between">
                
                <!-- logo del menu -->
                <div class="p-6 border-b-2 border-black text-center md:text-left bg-black text-white">
                    <h2 class="text-xl font-black uppercase tracking-widest">CC Analytics</h2>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-gray-300">Inteligencia Dptva.</p>
                </div>

                <!-- botones de navegacion q usan el app.js -->
                <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                    <button onclick="window.cargarVista('pages/home.html', 'dynamic-view')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-black border-2 border-transparent hover:border-black hover:bg-white transition-all uppercase">
                        <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                    </button>
                    <button onclick="window.cargarVista('pages/plantel.html', 'dynamic-view')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-black border-2 border-transparent hover:border-black hover:bg-white transition-all uppercase">
                        <i class="fa-solid fa-users w-5"></i> Plantel
                    </button>
                    <button onclick="window.cargarVista('pages/formaciones.html', 'dynamic-view')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-black border-2 border-transparent hover:border-black hover:bg-white transition-all uppercase">
                        <i class="fa-solid fa-chess-board w-5"></i> Táctica
                    </button>
                    <button onclick="window.cargarVista('pages/lesiones.html', 'dynamic-view')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-black border-2 border-transparent hover:border-black hover:bg-white transition-all uppercase">
                        <i class="fa-solid fa-heart-pulse w-5"></i> Médico
                    </button>
                    <button onclick="window.cargarVista('pages/calendario.html', 'dynamic-view')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-black border-2 border-transparent hover:border-black hover:bg-white transition-all uppercase">
                        <i class="fa-regular fa-calendar-days w-5"></i> Calendario
                    </button>
                </nav>

                <!-- pie del menu pal soporte -->
                <div class="p-4 border-t-2 border-black bg-white">
                    <button onclick="window.cargarVista('pages/soporte.html', 'dynamic-view')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-white bg-black hover:bg-gray-800 transition-all uppercase border-2 border-black">
                        <i class="fa-solid fa-headset w-5"></i> Soporte
                    </button>
                </div>
            </aside>

            <!-- contenedor dinamico para las paginas -->
            <main id="dynamic-view" class="flex-1 overflow-y-auto bg-white p-4 md:p-8 relative">
                <!-- el contenido carga aca por el app.js -->
            </main>

        </div>
    </div>
    
    <!-- scripts con la logica -->
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/soporte.js"></script>
</body>
</html>
