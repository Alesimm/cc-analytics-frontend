<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Analytics | Acceso</title>
    
    <!-- cargamos tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- cargamos iconos fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="relative w-full min-h-screen bg-white flex items-center justify-center overflow-hidden font-sans">

    <!-- capa de imagen de fondo corporativa con opacidad baja -->
    <div class="absolute inset-0 z-0 bg-cover bg-center" 
         style="background-image: url('https://d2xsxph8kpxj0f.cloudfront.net/310519663689721233/EKZ3k6UWPXd6xMygAzsmTd/cc-analytics-hero-ejpfpoxtyyaSFioBKs7ghg.webp'); opacity: 0.15;">
    </div>

    <!-- contenedor principal del login sobre el fondo -->
    <main id="login-view" class="relative z-10 bg-white p-10 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
        
        <!-- cabecera -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold uppercase tracking-tight text-black">CC Analytics</h1>
            <p class="text-gray-500 text-sm mt-2 font-light tracking-widest">Inteligencia Deportiva</p>
            <div class="w-12 h-1 bg-black mx-auto mt-4"></div>
        </div>

        <!-- formulario sin validaciones de html5 -->
        <form id="login-form" novalidate class="space-y-6">
            
            <!-- caja correo -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Correo Institucional</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-gray-400"></i>
                    </div>
                    <!-- input sin el atributo required -->
                    <input type="email" id="email" 
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-black focus:bg-white transition-all" 
                           placeholder="ejemplo@duoc.cl">
                </div>
                <!-- parrafo de error oculto para el js -->
                <p id="email-error" class="hidden text-red-500 text-xs font-bold mt-2 ml-1"></p>
            </div>

            <!-- caja contraseña -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <!-- input sin el atributo required -->
                    <input type="password" id="password" 
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-black focus:bg-white transition-all" 
                           placeholder="••••••••">
                </div>
                <!-- parrafo de error oculto para el js -->
                <p id="password-error" class="hidden text-red-500 text-xs font-bold mt-2 ml-1"></p>
            </div>

            <!-- boton submit -->
            <button type="submit" 
                    class="w-full bg-black text-white font-bold py-4 rounded-lg hover:bg-gray-800 transition duration-300 shadow-md">
                Ingresar
            </button>
        </form>
    </main>

    <!-- contenedor spa oculto para el dashboard -->
    <div id="app-view" class="hidden relative z-20 w-full min-h-screen bg-gray-100"></div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
