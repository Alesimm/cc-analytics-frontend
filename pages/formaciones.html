<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Analytics - Pizarra Táctica</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Hoja de estilos externa exigida por pauta -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-100 flex min-h-screen">

    <!-- Barra Lateral (Sidebar Estática) -->
    <aside class="w-64 bg-black text-white p-6 flex flex-col justify-between">
        <div>
            <h2 class="text-2xl font-bold mb-8">CC Analytics</h2>
            <nav class="space-y-4">
                <a href="home.html" class="block text-gray-400 hover:text-white transition"><i class="fa-solid fa-chart-line mr-2"></i> Dashboard</a>
                <a href="plantel.html" class="block text-gray-400 hover:text-white transition"><i class="fa-solid fa-users mr-2"></i> Plantel</a>
                <a href="formaciones.html" class="block text-white font-bold"><i class="fa-solid fa-chess-board mr-2"></i> Formaciones</a>
            </nav>
        </div>
    </aside>

    <!-- Contenedor Principal (Tu área de trabajo) -->
    <main class="flex-1 p-8">
        <h1 class="text-3xl font-bold mb-6">Laboratorio Táctico</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-md h-[600px] flex gap-6">
            
           <!-- CONTENEDOR DE LA CANCHA -->
<div class="w-2/3 bg-green-700 rounded-lg border-4 border-white relative overflow-hidden flex flex-col justify-center items-center">
    
    <!-- Líneas de la Cancha -->
    <div class="absolute w-1/2 h-full border-r-4 border-white left-0 opacity-50"></div> <!-- Línea de mediocampo -->
    <div class="absolute w-32 h-32 border-4 border-white rounded-full opacity-50"></div> <!-- Círculo central -->
    <div class="absolute left-0 w-24 h-48 border-4 border-white opacity-50 border-l-0"></div> <!-- Área local -->
    <div class="absolute right-0 w-24 h-48 border-4 border-white opacity-50 border-r-0"></div> <!-- Área visitante -->

    <!-- 11 Jugadores (Formación 3-4-3 Superclásico 2026) -->
    <!-- Arquero -->
    <div title="Gabriel Maureira" class="absolute left-6 top-1/2 -translate-y-1/2 w-10 h-10 bg-yellow-400 text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">25</div>
    
    <!-- Línea Defensiva (3) -->
    <div title="Jonathan Villagra" class="absolute left-20 top-[25%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">2</div>
    <div title="Arturo Vidal" class="absolute left-20 top-1/2 -translate-y-1/2 w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">23</div>
    <div title="Joaquín Sosa" class="absolute left-20 top-[75%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">4</div>

    <!-- Mediocampo (4) -->
    <div title="Jeyson Rojas" class="absolute left-40 top-[15%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">28</div>
    <div title="Álvaro Madrid" class="absolute left-48 top-[35%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">8</div>
    <div title="Víctor Méndez" class="absolute left-48 top-[65%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">5</div>
    <div title="Diego Ulloa" class="absolute left-40 top-[85%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">26</div>

    <!-- Delantera (3) -->
    <div title="Leandro Hernández" class="absolute left-72 top-[25%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">24</div>
    <div title="Javier Correa" class="absolute left-80 top-1/2 -translate-y-1/2 w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">9</div>
    <div title="Lautaro Pastrán" class="absolute left-72 top-[75%] w-10 h-10 bg-white text-black rounded-full flex items-center justify-center font-bold border-2 border-black shadow-md cursor-pointer hover:scale-110 transition">10</div>
</div>

<!-- PANEL DE CONTROL (Sliders) -->
<div class="w-1/3 bg-white p-6 rounded-lg border shadow-md flex flex-col gap-6">
    <h3 class="font-bold text-xl border-b pb-2 text-gray-800"><i class="fa-solid fa-sliders mr-2"></i>Ajustes Tácticos</h3>
    
    <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Línea de Presión</label>
        <input type="range" class="w-full cursor-pointer accent-black" min="1" max="100" value="75">
        <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>Baja</span><span>Alta</span>
        </div>
    </div>

    <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Bloque Defensivo</label>
        <input type="range" class="w-full cursor-pointer accent-black" min="1" max="100" value="40">
        <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>Retrasado</span><span>Adelantado</span>
        </div>
    </div>
    
    <button class="mt-auto bg-black text-white py-3 px-4 rounded font-bold hover:bg-gray-800 transition shadow"><i class="fa-solid fa-floppy-disk mr-2"></i>Guardar Táctica</button>
</div>

            <!-- PANEL DE CONTROL (Sliders) -->
            <div class="w-1/3 bg-gray-50 p-4 rounded border">
                <h3 class="font-bold mb-4 border-b pb-2">Controles Tácticos</h3>
                <!-- Aquí irán los controles de presión y bloque -->
            </div>

        </div>
    </main>

</body>
</html>
