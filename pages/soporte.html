<!-- caja principal del soporte tecnico -->
<div class="w-full max-w-4xl mx-auto fade-in">
    
    <!-- titulo de arriba -->
    <header class="flex justify-between items-center border-b-2 border-black pb-4 mb-8">
        <h1 class="text-2xl font-bold tracking-wide text-black uppercase">Soporte Técnico</h1>
        <div class="w-10 h-10 border-2 border-black flex items-center justify-center bg-white text-black">
            <i class="fa-solid fa-headset"></i>
        </div>
    </header>

    <!-- tarjeta blanca para form de contacto -->
    <div class="bg-white p-8 md:p-10 border-2 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        <h2 class="text-lg font-black uppercase tracking-wider mb-6 text-black">Generar Ticket de Ayuda</h2>
        
        <!-- el form con el novalidate -->
        <form id="soporte-form" novalidate class="space-y-6">
            
            <!-- input del nombre -->
            <div>
                <label for="soporte-nombre" class="block text-xs font-bold text-black uppercase tracking-wider mb-2">Nombre Completo</label>
                <input type="text" id="soporte-nombre" 
                       class="w-full px-4 py-3 bg-white border-2 border-black focus:outline-none focus:bg-gray-50 transition-colors rounded-none" 
                       placeholder="Ej: Alexander Simpertigue">
                <!-- p vacio pa inyectar error del nombre con js -->
                <p id="error-nombre" class="hidden text-red-600 text-xs font-bold mt-2 uppercase"></p>
            </div>

            <!-- input del correo -->
            <div>
                <label for="soporte-correo" class="block text-xs font-bold text-black uppercase tracking-wider mb-2">Correo Institucional</label>
                <input type="email" id="soporte-correo" 
                       class="w-full px-4 py-3 bg-white border-2 border-black focus:outline-none focus:bg-gray-50 transition-colors rounded-none" 
                       placeholder="ejemplo@colocolo.cl">
                <!-- p vacio pa inyectar error del correo -->
                <p id="error-correo" class="hidden text-red-600 text-xs font-bold mt-2 uppercase"></p>
            </div>

            <!-- el select de las opciones -->
            <div>
                <label for="soporte-motivo" class="block text-xs font-bold text-black uppercase tracking-wider mb-2">Motivo del Contacto</label>
                <div class="relative">
                    <select id="soporte-motivo" class="w-full px-4 py-3 bg-white border-2 border-black focus:outline-none focus:bg-gray-50 transition-colors appearance-none cursor-pointer rounded-none font-semibold text-sm">
                        <option value="" disabled selected>SELECCIONE UNA OPCIÓN...</option>
                        <option value="tecnico">PROBLEMA TÉCNICO (SOFTWARE)</option>
                        <option value="tactico">DUDAS MÓDULO TÁCTICO</option>
                        <option value="medico">DUDAS MÓDULO MÉDICO</option>
                        <option value="otro">OTRO</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-black">
                        <i class="fa-solid fa-caret-down text-lg"></i>
                    </div>
                </div>
                <!-- p vacio para error del motivo -->
                <p id="error-motivo" class="hidden text-red-600 text-xs font-bold mt-2 uppercase"></p>
            </div>

            <!-- la caja para texto largo -->
            <div>
                <label for="soporte-comentario" class="block text-xs font-bold text-black uppercase tracking-wider mb-2">Comentarios / Detalles</label>
                <textarea id="soporte-comentario" rows="5" 
                          class="w-full px-4 py-3 bg-white border-2 border-black focus:outline-none focus:bg-gray-50 transition-colors resize-none rounded-none" 
                          placeholder="Describe detalladamente el problema..."></textarea>
                <!-- p vacio para error del texto -->
                <p id="error-comentario" class="hidden text-red-600 text-xs font-bold mt-2 uppercase"></p>
            </div>

            <!-- boton de envio -->
            <div class="pt-4">
                <button type="submit" class="w-full md:w-auto px-10 bg-black text-white font-bold py-4 hover:bg-gray-800 hover:text-white transition-colors uppercase tracking-widest border-2 border-black">
                    Enviar Ticket
                </button>
            </div>
            
            <!-- el cartelito verde de exito q sale al final escondido -->
            <div id="soporte-exito" class="hidden bg-white border-2 border-black text-black p-4 mt-4 font-bold text-sm shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] uppercase">
                <i class="fa-solid fa-check mr-2"></i> Ticket enviado con éxito.
            </div>
        </form>
    </div>
</div>
